[package]
name = "zenpng"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "PNG encoding and decoding with zencodec trait integration"
categories = ["multimedia::images", "multimedia::encoding"]
keywords = ["png", "image", "encoder", "decoder", "codec"]
repository = "https://github.com/imazen/zenpng"
readme = "README.crates.md"
include = [
    "/src/**",
    "/examples/**",
    "/README.crates.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[dependencies]
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "f73a7e0e01c6d6eefb9f08c61f2bb71100e25f54", optional = true }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "f73a7e0e01c6d6eefb9f08c61f2bb71100e25f54", default-features = false, features = ["rewrite"], optional = true }
thiserror = { version = "2.0", default-features = false }
rgb = { version = "0.8", default-features = false, features = ["as-bytes"] }
imgref = "1.12"
bytemuck = { version = "1.25", default-features = false, features = ["extern_crate_alloc"] }
enough = "0.4.2"
zencodec = { version = ">=0.1.27, <0.3.0" }
zenpixels = { version = ">=0.2.11, <0.4.0", default-features = false, features = ["imgref"] }
zenpixels-convert = { version = ">=0.2.16, <0.4.0", features = ["imgref", "rgb"] }
zenquant = { version = "0.1.1", optional = true }
imagequant = { version = "4", optional = true }
quantette = { version = "0.6.0", optional = true, default-features = false, features = ["kmeans", "std"] }
whereat = "0.1.4"
zenflate = { version = "0.4.0" }
memchr = { version = "2.8.0", default-features = false }
garb = { version = "0.2.8" }
archmage = { version = ">=0.9.23, <=0.9.31-beta.1", default-features = false, features = ["macros", "std", "avx512"] }
magetypes = { version = ">=0.9.30, <=0.9.31-beta.1", default-features = false, features = ["std", "w512", "avx512"] }
safe_unaligned_simd = { version = "0.2.5", default-features = false }
linear-srgb = "0.6.5"
zenzop = { version = "0.4.1", optional = true, default-features = false, features = ["zlib", "std"] }
# zennode = { git = "https://github.com/imazen/zennode.git", optional = true, default-features = false, features = ["derive"] }
almost-enough = { version = "0.4.2", features = ["std"] }

# Pins parallel-decode workers to one CPU core tier (safe syscall wrappers).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "thread"] }

[dev-dependencies]
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "f73a7e0e01c6d6eefb9f08c61f2bb71100e25f54", features = ["std"] }
png = "0.18"
# image-rs/image-png main, for benches/vs_png.rs (pinned commit; 2026-10-05).
png_main = { package = "png", git = "https://github.com/image-rs/image-png", rev = "b2f10c6a7e3127d4aaf231f3eae731a33e6eb0bc" }
sha2 = "0.11.0"
flate2 = "1"
miniz_oxide = "0.9.1"
# image-png's inflater, for examples/inflate_bench.rs.
fdeflate = "0.3.7"
zopfli = "0.8"
lodepng = "3.12.2"
# The root patch keeps the conformance harness and codec on one trait source.
zencodec-testkit = ">=0.1.0, <0.3.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
codec-corpus = "1.0.2"
libdeflater = "1.25"
zenbench = "0.1.8"
# Bench-input generation only (examples/gen_bench_inputs.rs).
zenresize = "0.3.1"
# Pareto-bench competitors (benches/pareto.rs only).
zune-png = "0.5.2"
zune-core = "0.5.3"
lodepng = "3.12.2"

# Causal-profiler progress points, used only by examples/coz_harness.rs. coz
# resolves its counters only on Linux, and 0.1.3 does not compile for Windows
# (unconditional libc sigaltstack/mmap), so the harness gates its calls too.
[target.'cfg(target_os = "linux")'.dev-dependencies]
coz = "0.1.3"

[profile.test]
opt-level = 2

[features]
controlled-decode = ["dep:zencodec-coroutine"]
metadata-rewrite = ["dep:zenmeta"]
# Structural inspection and count-only DEFLATE scanning are opt-in.
inventory = ["zenflate/scan"]
default = ["quantize"]
quantize = ["dep:zenquant"]
imagequant = ["dep:imagequant"]
quantette = ["dep:quantette"]
joint = ["quantize", "zenquant/joint"]
unchecked = ["zenflate/unchecked"]
zopfli = ["dep:zenzop"]
# Deprecated no-op stub: `zencodec` has been a required (always-on) dependency
# since 0.2.0, so this feature gates nothing. Kept for one release cycle so
# downstream `--features zencodec` (e.g. zenpipe/zencodecs) still resolves
# instead of hard-erroring with "Package 'zenpng' does not have feature
# 'zencodec'". Remove once those consumers drop the explicit feature request.
zencodec = []
# ICC synthesis for the zencodec color-emit path, via zenpixels-convert's
# `icc-db` feature: a bundled LZ4 profile blob + pure-Rust lz4_flex decoder —
# no moxcms. Covers the full ITU-T H.273 grid incl PQ/HLG (without it, only
# the bundled Display-P3 / SDR BT.2020 / AdobeRGB consts synthesize, and an
# off-grid CICP is an encode error — never a silently mislabeled image).
cms = ["zenpixels-convert/icc-db"]
# zennode = ["dep:zennode"]
# Expert-only cross-codec uniformity knobs. Pure visibility gate (no deps):
# exposes `InternalParams` + `EncodeConfig::with_internal_params`, mirroring
# `zenjpeg`'s `__expert` feature so a single picker model can drive every zen
# codec with one Option-bundle shape. No new tunables — the fields just route
# through existing public builder setters.
__expert = []
_dev = ["archmage/testable_dispatch"]
# Acknowledged by archmage's `incant!` cfg — kept always-on; no-op for users
# (we always compile the AVX-512 path so V4x dispatch is available at runtime).
avx512 = []

[[example]]
name = "phase_timing"
required-features = ["_dev"]

[[example]]
name = "decode_bench"
required-features = ["_dev"]

[[example]]
name = "unfilter_bench"
required-features = ["_dev"]

[[example]]
name = "roundtrip_sweep"
required-features = ["_dev"]

[[example]]
name = "idot_probe"
required-features = ["_dev"]

[[example]]
name = "idot_bench"
required-features = ["_dev"]

[[example]]
name = "idot_encode"
required-features = ["_dev"]

[[example]]
name = "idot_imageio_compare"
required-features = ["_dev"]

[[example]]
name = "joint_bench"
required-features = ["joint"]

[[example]]
name = "bench_delta"
required-features = ["quantize", "_dev"]

[[example]]
name = "strategy_explorer"

[[bench]]
name = "scan_predicates"
harness = false
required-features = ["_dev"]

[[bench]]
name = "fused_predicates"
harness = false
required-features = ["_dev"]

[[bench]]
name = "unfilter_tiers"
harness = false
required-features = ["_dev"]

[[bench]]
name = "vs_png"
harness = false

[[bench]]
name = "pareto"
harness = false

[[bench]]
name = "scalar_vs_simd"
harness = false
required-features = ["_dev"]

[patch.crates-io]
# Coordinated exact animation timing series; one source for shared types.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "f73a7e0e01c6d6eefb9f08c61f2bb71100e25f54" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "f73a7e0e01c6d6eefb9f08c61f2bb71100e25f54" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f8596aae7a16aec7875b6fe2ef39b501c11a0e82" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f8596aae7a16aec7875b6fe2ef39b501c11a0e82" }
# Retain main's strip-compression API source.
zenflate = { git = "https://github.com/imazen/zenflate", rev = "a0ea03637a2cc9a193e343018ae2cfb1a6c31edd" }

