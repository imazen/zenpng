[package]
name = "zenpng"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "PNG encoding and decoding with zencodec trait integration"
categories = ["multimedia::images", "multimedia::encoding"]
keywords = ["png", "image", "encoder", "decoder", "codec"]
repository = "https://github.com/imazen/zenpng"
readme = "README.crates.md"
include = [
    "/src/**",
    "/examples/**",
    "/README.crates.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[dependencies]
# The zencodec 0.3 family: version edges, resolved by each root's own
# [patch.crates-io] (dependency patch tables do not propagate).
zencodec-coroutine = { version = "0.2.0", optional = true }
zenmeta = { version = "0.2.0", default-features = false, features = ["rewrite"], optional = true }
thiserror = { version = "2.0.21", default-features = false }
rgb = { version = "0.8.53", default-features = false, features = ["as-bytes"] }
imgref = "1.12.3"
bytemuck = { version = "1.25.2", default-features = false, features = ["extern_crate_alloc"] }
enough = "0.4.5"
zencodec = { version = ">=0.3.0, <0.5.0" }
zenpixels = { version = ">=0.5.0, <0.6.0", default-features = false, features = ["icc", "imgref"] }
# Balanced PNG emission has supplied PQ ICC companions even without `cms`.
# In 0.5 the profile database is opt-in, so preserve that contract explicitly.
zenpixels-convert = { version = ">=0.5.0, <0.6.0", features = ["icc-db", "imgref", "rgb"] }
zenquant = { version = "0.1.3", optional = true }
imagequant = { version = "4", optional = true }
quantette = { version = "0.6.0", optional = true, default-features = false, features = ["kmeans", "std"] }
whereat = "0.1.5"
zenflate = { version = "0.4.1" }
memchr = { version = "2.8.0", default-features = false }
garb = { version = "0.2.9" }
archmage = { version = "0.9.33", default-features = false, features = ["macros", "std", "avx512"] }
magetypes = { version = "0.9.33", default-features = false, features = ["std", "w512", "avx512"] }
safe_unaligned_simd = { version = "0.2.5", default-features = false }
linear-srgb = "0.6.13"
zenzop = { version = "0.4.2", optional = true, default-features = false, features = ["zlib", "std"] }
# zennode = { git = "https://github.com/imazen/zennode.git", optional = true, default-features = false, features = ["derive"] }
almost-enough = { version = "0.4.5", features = ["std"] }

# Pins parallel-decode workers to one CPU core tier (safe syscall wrappers).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "thread"] }

[dev-dependencies]
zencodec-io = { version = "0.2.0", features = ["std"] }
png = "0.18"
# image-rs/image-png main, for benches/vs_png.rs (pinned commit; 2026-10-05).
png_main = { package = "png", git = "https://github.com/image-rs/image-png", rev = "b2f10c6a7e3127d4aaf231f3eae731a33e6eb0bc" }
sha2 = "0.11.0"
flate2 = "1"
miniz_oxide = "0.9.1"
# image-png's inflater, for examples/inflate_bench.rs.
fdeflate = "0.3.7"
zopfli = "0.8"
lodepng = "3.12.2"
# The root patch keeps the conformance harness and codec on one trait source.
zencodec-testkit = ">=0.3.0, <0.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
codec-corpus = "1.0.2"
libdeflater = "1.25"
zenbench = "0.1.11"
# Pareto-bench competitors (benches/pareto.rs only).
zune-png = "0.5.2"
zune-core = "0.5.3"
lodepng = "3.12.2"

# Causal-profiler progress points, used only by examples/coz_harness.rs. coz
# resolves its counters only on Linux, and 0.1.3 does not compile for Windows
# (unconditional libc sigaltstack/mmap), so the harness gates its calls too.
[target.'cfg(target_os = "linux")'.dev-dependencies]
coz = "0.1.3"

[profile.test]
opt-level = 2

[features]
controlled-decode = ["dep:zencodec-coroutine"]
metadata-rewrite = ["dep:zenmeta"]
# Structural inspection and count-only DEFLATE scanning are opt-in.
inventory = ["zenflate/scan"]
default = ["quantize"]
quantize = ["dep:zenquant"]
imagequant = ["dep:imagequant"]
quantette = ["dep:quantette"]
joint = ["quantize", "zenquant/joint"]
unchecked = ["zenflate/unchecked"]
zopfli = ["dep:zenzop"]
# Deprecated no-op stub: `zencodec` has been a required (always-on) dependency
# since 0.2.0, so this feature gates nothing. Kept for one release cycle so
# downstream `--features zencodec` (e.g. zenpipe/zencodecs) still resolves
# instead of hard-erroring with "Package 'zenpng' does not have feature
# 'zencodec'". Remove once those consumers drop the explicit feature request.
zencodec = []
# Compatibility feature for the now-unconditional ICC companion database.
cms = ["zenpixels-convert/icc-db"]
# zennode = ["dep:zennode"]
# Expert-only cross-codec uniformity knobs. Pure visibility gate (no deps):
# exposes `InternalParams` + `EncodeConfig::with_internal_params`, mirroring
# `zenjpeg`'s `__expert` feature so a single picker model can drive every zen
# codec with one Option-bundle shape. No new tunables — the fields just route
# through existing public builder setters.
__expert = []
_dev = ["archmage/testable_dispatch"]
# Acknowledged by archmage's `incant!` cfg — kept always-on; no-op for users
# (we always compile the AVX-512 path so V4x dispatch is available at runtime).
avx512 = []

[[example]]
name = "phase_timing"
required-features = ["_dev"]

[[example]]
name = "decode_bench"
required-features = ["_dev"]

[[example]]
name = "unfilter_bench"
required-features = ["_dev"]

[[example]]
name = "roundtrip_sweep"
required-features = ["_dev"]

[[example]]
name = "idot_probe"
required-features = ["_dev"]

[[example]]
name = "idot_bench"
required-features = ["_dev"]

[[example]]
name = "idot_encode"
required-features = ["_dev"]

[[example]]
name = "idot_imageio_compare"
required-features = ["_dev"]

[[example]]
name = "joint_bench"
required-features = ["joint"]

[[example]]
name = "bench_delta"
required-features = ["quantize", "_dev"]

[[example]]
name = "strategy_explorer"

[[bench]]
name = "scan_predicates"
harness = false
required-features = ["_dev"]

[[bench]]
name = "fused_predicates"
harness = false
required-features = ["_dev"]

[[bench]]
name = "unfilter_tiers"
harness = false
required-features = ["_dev"]

[[bench]]
name = "vs_png"
harness = false

[[bench]]
name = "pareto"
harness = false

[[bench]]
name = "scalar_vs_simd"
harness = false
required-features = ["_dev"]

[[bench]]
name = "stream_and_apng"
harness = false

[patch.crates-io]
# One zencodec family revision for the zenpixels 0.5 interchange types.
# These patches also resolve the unpublished I/O, coroutine and metadata crates.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "d40a957e95d19ea3fb5c29472820c86e8a34b09e" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "d40a957e95d19ea3fb5c29472820c86e8a34b09e" }
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
# Retain main's strip-compression API source.
zenflate = { git = "https://github.com/imazen/zenflate", rev = "7270e38faca9cdbae793938fa229d40ac4fe4c39" }

