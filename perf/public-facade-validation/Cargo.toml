[package]
name = "png-facade-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
"tokio" = { version = "1.54.1", features = ["rt", "macros"] }
"zenpng" = { path = "../..", default-features = false }
"zencodec" = { version = ">=0.2.0, <0.4.0", features = ["std"] }
"zencodec-io" = { version = "0.1.0", features = ["std", "tokio"] }
"zencodec-testkit" = ">=0.2.0, <0.4.0"
"zenpixels" = ">=0.3.1, <0.5.0"
"zenpixels-convert" = { version = ">=0.3.1, <0.4.0", features = ["rgb", "imgref"] }
"zenflate" = "0.4.0"
"png" = "0.18.1"
"sha2" = "0.11.1"

[patch.crates-io]
"zencodec" = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
"zencodec-io" = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
"zencodec-coroutine" = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
"zenmeta" = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
"zencodec-testkit" = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
"zenpixels" = { git = "https://github.com/imazen/zenpixels", rev = "3ceb0500059456aacc16c7aecb43b2d167ce1535" }
"zenpixels-convert" = { git = "https://github.com/imazen/zenpixels", rev = "3ceb0500059456aacc16c7aecb43b2d167ce1535" }
"garb" = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
"linear-srgb" = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
"zenflate" = { git = "https://github.com/imazen/zenflate", rev = "a2c7d540fc8f044f7c75398f1c49775560021862" }

[[test]]
name = "source_color_binding"
path = "../../tests/source_color_binding.rs"

[[test]]
name = "encode_carrier_policy"
path = "../../tests/integration/encode_carrier_policy.rs"

[[test]]
name = "encode_carrier_context"
path = "../../tests/integration/encode_carrier_context.rs"

[[test]]
name = "significant_bits_details"
path = "../../tests/significant_bits_details.rs"

[[test]]
name = "animation_color_negotiation"
path = "../../tests/animation_color_negotiation.rs"

[[test]]
name = "row_planning"
path = "../../tests/row_planning.rs"

[[test]]
name = "apng_byte_identity"
path = "../../tests/apng_byte_identity.rs"
