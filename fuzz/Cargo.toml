[package]
name = "zenpng-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4"
# TEMPORARY: zencodec PR (structural inventories); swap for the released version before merge.
zencodec = { git = "https://github.com/imazen/zencodec", branch = "feat/inventory" }

[dependencies.zenpng]
path = ".."

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_apng"
path = "fuzz_targets/fuzz_decode_apng.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_strict"
path = "fuzz_targets/fuzz_decode_strict.rs"
test = false
doc = false
bench = false


# DEV-ONLY: zenflate's PNG strip API (`zenflate::png::{StripCompressor,
# StripDecoder}`, `CompressionLevel::png`) is in imazen/zenflate#10
# (main since imazen/zenflate#10 merged), not yet released. Local builds use the sibling checkout;
# CI checks out zenflate main at ../zenflate. Replace with the released version
# once it ships. The fuzz crate is its own workspace, so the root patch does not reach it.
[patch.crates-io]
# TEMPORARY: zenflate::zlib_scan (imazen/zenflate branch feat/deflate-scan, on top of
# main with the PNG strip API) places the inventory's IDAT/fdAT cuts. Back to the
# released version once both ship.
zenflate = { git = "https://github.com/imazen/zenflate", branch = "feat/deflate-scan" }
# TEMPORARY: unify zencodec with the inventory PR branch (see above).
zencodec = { git = "https://github.com/imazen/zencodec", branch = "feat/inventory" }
