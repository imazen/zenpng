[package]
name = "zenpng-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4"

[dependencies.zenpng]
path = ".."

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_apng"
path = "fuzz_targets/fuzz_decode_apng.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_strict"
path = "fuzz_targets/fuzz_decode_strict.rs"
test = false
doc = false
bench = false


# Same DEV-ONLY zenflate patch as the root Cargo.toml (imazen/zenflate#9,
# segment APIs). The fuzz crate is its own workspace, so the root patch does
# not reach it. Drop both once the zenflate release ships.
[patch.crates-io]
zenflate = { git = "https://github.com/imazen/zenflate", rev = "2d4b05e03421cf13900d41adb7a255aa2a075983" }
