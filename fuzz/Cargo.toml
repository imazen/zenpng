[package]
name = "zenpng-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4"
zencodec = ">=0.2.0, <0.3.0"

[dependencies.zenpng]
path = ".."
features = ["inventory"]

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_apng"
path = "fuzz_targets/fuzz_decode_apng.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_strict"
path = "fuzz_targets/fuzz_decode_strict.rs"
test = false
doc = false
bench = false


# This standalone workspace must use the same unreleased API sources as the root.
[patch.crates-io]
# The zencodec 0.2 family from the root's core revision; one source for shared types.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "db6ec36d0072988888f6175695bc33c840bbcc93" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "3ceb0500059456aacc16c7aecb43b2d167ce1535" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "3ceb0500059456aacc16c7aecb43b2d167ce1535" }
# Repeat the qualified pixel numerical sources at each standalone root.
garb = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }

# Retain main's strip-compression API source.
zenflate = { git = "https://github.com/imazen/zenflate", rev = "a0ea03637a2cc9a193e343018ae2cfb1a6c31edd" }


[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

