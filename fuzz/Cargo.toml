[package]
name = "zenpng-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4"

[dependencies.zenpng]
path = ".."

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_apng"
path = "fuzz_targets/fuzz_decode_apng.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_strict"
path = "fuzz_targets/fuzz_decode_strict.rs"
test = false
doc = false
bench = false


# This standalone workspace must use the same unreleased API sources as the root.
[patch.crates-io]
# Coordinated exact animation timing series; one source for shared types.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "2031094449ad1177ff96461d7c4d586c7ed384e6" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "2031094449ad1177ff96461d7c4d586c7ed384e6" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b" }
# Retain main's strip-compression API source.
zenflate = { git = "https://github.com/imazen/zenflate", rev = "9f8684bf789297bb8bf043bc9d43f2c3b6f5dae2" }

